name: Official Collector interoperability
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  external-interop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - uses: ./.github/actions/setup-verified-moon
      - run: moon update
      - run: moon run tools/run_external_interop.mbtx --target native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: external-interop-${{ matrix.os }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            _build/interop/expanded.result.json
            _build/interop/README.md
            _build/interop/official-collector.log
            _build/interop/harness.stdout.txt
            _build/interop/harness.stderr.txt

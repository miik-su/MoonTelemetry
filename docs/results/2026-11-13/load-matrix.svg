ont-size='15' fill='#334155'>512 KiB / 4 clients</text><text x='315' y='291' font-size='15' fill='#334155'>472</text><text x='495' y='291' font-size='15' fill='#334155'>0</text><text x='650' y='291' font-size='15' fill='#334155'>0</text><text x='860' y='291' font-size='15' fill='#334155'>559 / 622</text><path d='M32 355H1048' stroke='#e2e8f0'/><text x='32' y='339' font-size='15' fill='#334155'>Slow output / 8 clients</text><text x='315' y='339' font-size='15' fill='#334155'>86200</text><text x='495' y='339' font-size='15' fill='#334155'>0</text><text x='650' y='339' font-size='15' fill='#334155'>0</text><text x='860' y='339' font-size='15' fill='#334155'>30 / 39</text><text x='32' y='404' font-size='20' fill='#0f172a'>Slow destination: every admitted input copy must be accounted for</text><rect x='32' y='428' width='520.3287238979118' height='38' fill='#0d9488'/><rect x='552.3287238979118' y='428' width='142.64074245939673' height='38' fill='#d97706'/><rect x='694.9694663573085' y='428' width='353.0305336426914' height='38' fill='#dc2626'/><text x='32' y='495' font-size='15' fill='#0f766e'>Delivered: 44146</text><text x='365' y='495' font-size='15' fill='#92400e'>Send failures: 12102</text><text x='720' y='495' font-size='15' fill='#b91c1c'>Queue overflow: 29952</text><text x='32' y='533' font-size='15' fill='#334155'>File destination delivered all 86200 records in the slow scenario; slow copies can be lost.</text><text x='32' y='566' font-size='14' fill='#334155'>All scenarios: closed state, zero final logical/request budget and a verified latency sample window.</text><text x='32' y='600' font-size='14' fill='#334155'>Latency is the final rolling sample. Retained raw JSON and progress files provide the full context.</text><text x='32' y='631' font-size='13' fill='#334155'>Source: docs/results/2026-11-13/load-matrix.raw.json | Experimental; volatile delivery.</text></g></svg>

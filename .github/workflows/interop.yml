name: Official Collector interoperability
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  external-interop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
        with:
          version: 0.10.20+65efd5b93
          core-version: 0.10.20+65efd5b93
      - run: moon update
      - run: moon run tools/run_external_interop.mbtx --target native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: external-interop-${{ matrix.os }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            _build/interop/expanded.result.json
            _build/interop/README.md
            _build/interop/official-collector.log
            _build/interop/harness.stdout.txt
            _build/interop/harness.stderr.txt

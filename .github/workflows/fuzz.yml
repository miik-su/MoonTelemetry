name: Coverage guided mutation regression
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Bounded mutation count (64..100000)'
        default: '1024'
        required: true
  push:
    paths: ['core/**', 'config/**', 'processor/**', 'receiver/**', 'examples/filtered-collector.json', 'tests/fuzzcase/**', 'tests/fuzz-corpus/**', 'tools/*fuzz*.mbtx', '.github/workflows/fuzz.yml']
  pull_request:
    paths: ['core/**', 'config/**', 'processor/**', 'receiver/**', 'examples/filtered-collector.json', 'tests/fuzzcase/**', 'tests/fuzz-corpus/**', 'tools/*fuzz*.mbtx', '.github/workflows/fuzz.yml']
permissions:
  contents: read
jobs:
  coverage-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
        with:
          version: 0.10.20+65efd5b93
          core-version: 0.10.20+65efd5b93
      - run: moon update
      - run: moon build tests/fuzzcase --target native --enable-coverage
      - run: moon run tools/replay_fuzz_corpus.mbtx --target native
      - run: moon run tools/coverage_fuzz.mbtx --target native
        env:
          MOONTELEMETRY_FUZZ_ITERATIONS: ${{ inputs.iterations || '1024' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coverage-guided-corpus
          path: |
            _build/fuzz/
            _build/fuzz-replay/
          retention-days: 30
          if-no-files-found: warn

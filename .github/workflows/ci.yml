name: Native key checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  key-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1
        with:
          version: 0.10.20+65efd5b93
          core-version: 0.10.20+65efd5b93
      - run: moon update
      - run: moon version --all
      - run: moon check --target native
      - run: moon run tools/check_dependencies.mbtx --target native
      - run: moon fmt --check
      - run: moon run tools/check_protocol_metadata.mbtx
      - run: moon run tools/render_results.mbtx
      - run: git diff --exit-code -- docs/results/benchmark.svg
      - run: moon run tools/render_current_results.mbtx --target native
      - run: git diff --exit-code -- docs/results/2026-11-13/load-matrix.svg
      - run: moon run tools/check_soak_results.mbtx --target native
      - run: moon run tools/render_soak_results.mbtx --target native
      - run: git diff --exit-code -- docs/results/2026-11-13/soak-3600-summary.json docs/results/2026-11-13/soak-3600.svg
      - run: moon run tools/generate_metadata.mbtx
      - run: git diff --exit-code -- core/component/version.generated.mbt
      - run: moon info
      - run: git diff --exit-code -- '**/pkg.generated.mbti'
      - run: moon test --target native -p core/component
      - run: moon test --target native -p pipeline
      - run: moon test --target native -p extensions/memory
      - run: moon test --target native -p core/data
      - run: moon test --target native -p processor
      - run: moon test --target native -p config
      - run: moon test --target native -p exporter
      - run: moon test --target native -p service
      - run: moon test --target native -p cli
      - run: moon test --target native -p receiver/otlp
      - run: moon test --target native -p tests/integration
      - run: moon run cmd/moontelemetry --target native -- validate --config examples/collector.json
      - run: moon run examples/codec-demo --target native
      - name: Measure short HTTP smoke workload
        run: moon run benchmarks/collector --release -- --seconds 5
        env:
          MOONTELEMETRY_BENCHMARK_RESULT_PATH: _build/ci-benchmark.json
      - name: Publish job summary and structured results
        run: moon run tools/publish_ci_results.mbtx
        env:
          MOONTELEMETRY_KEY_CHECKS_PASSED: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: validation-results-${{ matrix.os }}
          path: _build/ci-results/
          retention-days: 30
          if-no-files-found: warn

receivers:
  otlp/reference:
    protocols:
      http:
        endpoint: 127.0.0.1:14319
        max_request_body_size: 4096
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:14318
exporters:
  debug:
    verbosity: detailed
  otlp_http/moon:
    endpoint: http://127.0.0.1:34318
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: false
service:
  telemetry:
    metrics:
      level: none
      readers: []
  pipelines:
    logs/reference:
      receivers: [otlp/reference]
      exporters: [debug]
    metrics/reference:
      receivers: [otlp/reference]
      exporters: [debug]
    traces/reference:
      receivers: [otlp/reference]
      exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug, otlp_http/moon]
    metrics:
      receivers: [otlp]
      exporters: [debug, otlp_http/moon]
    traces:
      receivers: [otlp]
      exporters: [debug, otlp_http/moon]

name: Native lifecycle fault checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-verified-moon
      - run: moon update
      - run: moon test tests/integration/disk_full_test.mbt --target native --verbose
      - run: moon build cmd/moontelemetry --target native --release
      - run: moon run tools/fault_checks.mbtx --target native
        env:
          MOONTELEMETRY_TEST_TMPFS: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lifecycle-fault-results
          path: _build/fault-results/
          retention-days: 30
          if-no-files-found: warn

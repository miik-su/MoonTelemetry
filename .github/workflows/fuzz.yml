name: Coverage guided mutation regression
on:
  workflow_dispatch:
  push:
    paths: ['core/**', 'config/**', 'receiver/**', 'tests/fuzzcase/**', 'tools/coverage_fuzz.mbtx', '.github/workflows/fuzz.yml']
  pull_request:
    paths: ['core/**', 'config/**', 'receiver/**', 'tests/fuzzcase/**', 'tools/coverage_fuzz.mbtx', '.github/workflows/fuzz.yml']
permissions:
  contents: read
jobs:
  coverage-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
        with:
          version: 0.10.20+65efd5b93
          core-version: 0.10.20+65efd5b93
      - run: moon update
      - run: moon build tests/fuzzcase --target native --enable-coverage
      - run: moon run tools/coverage_fuzz.mbtx --target native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-guided-corpus
          path: _build/fuzz/
          retention-days: 30
          if-no-files-found: warn

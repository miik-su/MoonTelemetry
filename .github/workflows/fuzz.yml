name: Coverage guided mutation regression
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Bounded mutation count (64..100000)'
        default: '1024'
        required: true
  push:
    paths: ['.github/actions/setup-verified-moon/**', 'tools/dependency-policy.json', 'core/**', 'config/**', 'processor/**', 'receiver/**', 'examples/filtered-collector.json', 'tests/fuzzcase/**', 'tests/fuzz-corpus/**', 'tools/*fuzz*.mbtx', '.github/workflows/fuzz.yml']
  pull_request:
    paths: ['.github/actions/setup-verified-moon/**', 'tools/dependency-policy.json', 'core/**', 'config/**', 'processor/**', 'receiver/**', 'examples/filtered-collector.json', 'tests/fuzzcase/**', 'tests/fuzz-corpus/**', 'tools/*fuzz*.mbtx', '.github/workflows/fuzz.yml']
permissions:
  contents: read
jobs:
  coverage-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-verified-moon
      - run: moon update
      - run: moon build tests/fuzzcase --target native --enable-coverage
      - run: moon run tools/replay_fuzz_corpus.mbtx --target native
      - run: moon run tools/coverage_fuzz.mbtx --target native
        env:
          MOONTELEMETRY_FUZZ_ITERATIONS: ${{ inputs.iterations || '1024' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-guided-corpus
          path: |
            _build/fuzz/
            _build/fuzz-replay/
          retention-days: 30
          if-no-files-found: warn

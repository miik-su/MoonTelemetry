name: Linux Compose and TLS deployment checks
on:
  workflow_dispatch:
  push:
    paths: ['examples/deployment/**', 'tools/check_deployment.mbtx', '.github/workflows/deployment.yml', 'cmd/moontelemetry/**', 'service/**', 'receiver/**']
  pull_request:
    paths: ['examples/deployment/**', 'tools/check_deployment.mbtx', '.github/workflows/deployment.yml', 'cmd/moontelemetry/**', 'service/**', 'receiver/**']
permissions:
  contents: read
jobs:
  deployment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76
        with:
          version: 0.10.20+65efd5b93
          core-version: 0.10.20+65efd5b93
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends nginx
      - run: moon update
      - run: moon build cmd/moontelemetry --target native --release
      - run: moon run tools/check_deployment.mbtx --target native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: linux-deployment-check
          path: _build/deployment-check/
          retention-days: 30
